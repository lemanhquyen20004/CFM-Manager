plugins {
    id 'com.android.application'
}

def signingFile = System.getenv('CFM_KEYSTORE_FILE')
def signingStorePassword = System.getenv('CFM_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('CFM_KEY_ALIAS')
def signingKeyPassword = System.getenv('CFM_KEY_PASSWORD')

android {
    namespace 'com.cfm.manager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cfm.manager'
        minSdk 26
        targetSdk 30
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    signingConfigs {
        release {
            if (signingFile != null && !signingFile.isEmpty()) {
                storeFile file(signingFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile != null && !signingFile.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
