name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify signing secrets
        env:
          CFM_KEYSTORE_BASE64: ${{ secrets.CFM_KEYSTORE_BASE64 }}
          CFM_KEYSTORE_PASSWORD: ${{ secrets.CFM_KEYSTORE_PASSWORD }}
          CFM_KEY_ALIAS: ${{ secrets.CFM_KEY_ALIAS }}
          CFM_KEY_PASSWORD: ${{ secrets.CFM_KEY_PASSWORD }}
        run: |
          test -n "$CFM_KEYSTORE_BASE64" || { echo "Missing CFM_KEYSTORE_BASE64"; exit 1; }
          test -n "$CFM_KEYSTORE_PASSWORD" || { echo "Missing CFM_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$CFM_KEY_ALIAS" || { echo "Missing CFM_KEY_ALIAS"; exit 1; }
          test -n "$CFM_KEY_PASSWORD" || { echo "Missing CFM_KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore
        env:
          CFM_KEYSTORE_BASE64: ${{ secrets.CFM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CFM_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          chmod 600 app/release.keystore

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          TAG="${GITHUB_REF_NAME}"
          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "Tag $TAG does not match app versionName $VERSION_NAME"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          CFM_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          CFM_KEYSTORE_PASSWORD: ${{ secrets.CFM_KEYSTORE_PASSWORD }}
          CFM_KEY_ALIAS: ${{ secrets.CFM_KEY_ALIAS }}
          CFM_KEY_PASSWORD: ${{ secrets.CFM_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          APK="dist/CFM-Manager-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/CFM-Manager-v${{ steps.version.outputs.name }}.apk" \
            "dist/CFM-Manager-v${{ steps.version.outputs.name }}.apk.sha256" \
            --title "CFM Manager v${{ steps.version.outputs.name }}" \
            --notes-file release-notes.txt

      - name: Update update.json on main
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(cat release-notes.txt)
          export NOTES
          python3 - <<'PY'
          import json, os
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/lemanhquyen20004/CFM-Manager/releases/download/{os.environ['RELEASE_TAG']}/CFM-Manager-v{os.environ['VERSION_NAME']}.apk",
              "changelog": os.environ["NOTES"].strip(),
          }
          with open('/tmp/update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git fetch origin main
          git checkout main
          cp /tmp/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json already current"
          else
            git commit -m "chore: publish update manifest v${VERSION_NAME}"
            git push origin main
          fi
